name: Build Q2 Simulator release apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            file: Q2-Simulator-Windows-x64.zip
          - platform: Linux x64
            runner: ubuntu-22.04
            file: Q2-Simulator-Linux-x64.tar.gz
          - platform: macOS Intel
            runner: macos-15-intel
            file: Q2-Simulator-macOS-x64.zip
          - platform: macOS Apple Silicon
            runner: macos-15-arm64
            file: Q2-Simulator-macOS-arm64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build and smoke-test standalone application
        run: python scripts/package_simulator.py
      - name: Keep downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error
      - name: Attach application to published GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_FILE: ${{ matrix.file }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "dist/$RELEASE_FILE" --clobber
